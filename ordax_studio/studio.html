<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORDAX Studio</title>
<style>
:root{color-scheme:dark;--bg:#080f19;--panel:#0c1625;--panel2:#111e30;--border:#243249;--text:#e2ebf7;--muted:#8e9db4;--accent:#a9c9f7;--button:#d1e4ff;--buttonText:#172b47;--ok:#9fd7b1;--warn:#e8c27a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,system-ui,sans-serif;overflow:hidden}
button{font:inherit;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--button);color:var(--buttonText);border-color:transparent}button:disabled{opacity:.45;cursor:not-allowed}
header{height:60px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:#09121e}.brand{font-size:18px;font-weight:600}.spacer{flex:1}#status{color:var(--muted);font-size:12px}.hidden{display:none!important}
#projectHome{height:calc(100% - 60px);overflow:auto;padding:42px max(28px,6vw) 60px}.homeTitle{font-size:30px;font-weight:450;margin:0 0 8px}.homeSubtitle{color:var(--muted);font-size:15px;margin-bottom:28px}.projectGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;max-width:1240px}
.projectCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;min-height:190px;display:flex;flex-direction:column;gap:11px}.projectCard:hover{border-color:#355071}.projectTop{display:flex;gap:10px;align-items:flex-start}.repoIcon{width:38px;height:38px;border-radius:9px;background:#172b47;display:grid;place-items:center;font-weight:700;color:var(--accent)}.projectName{font-size:17px;font-weight:600}.projectPath,.projectRemote{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:11px}.chip.git{color:var(--ok)}.chip.dirty{color:var(--warn)}.projectActions{margin-top:auto;display:flex;justify-content:flex-end}
#workspace{height:calc(100% - 60px)}#workspaceHead{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel)}#workspaceRepo{font-weight:600}#workspaceMeta{color:var(--muted);font-size:12px}.layout{height:calc(100% - 48px);display:grid;grid-template-columns:250px minmax(340px,1fr) minmax(360px,44%)}
.pane{min-width:0;min-height:0;border-right:1px solid var(--border);display:flex;flex-direction:column}.pane:last-child{border-right:0}.paneHead{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--panel)}.paneHead strong{font-size:11px;color:var(--muted);letter-spacing:.8px}
#files{overflow:auto;padding:8px;background:var(--panel)}.file{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:6px 8px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file:hover{background:var(--panel2);color:var(--text)}.file.active{background:#172b47;color:var(--text)}
</style>
</head><body>
<header><div class="brand">ORDAX Studio</div><div id="sessionLabel" class="hidden"></div><div class="spacer"></div><div id="status">Inicializando...</div></header>
<main id="projectHome">
  <h1 class="homeTitle">Projetos</h1>
  <div class="homeSubtitle">Cada projeto corresponde a um repositório local registrado no ORDAX.</div>
  <div id="projectGrid" class="projectGrid"></div>
</main>
<main id="workspace" class="hidden">
  <div id="workspaceHead">
    <button onclick="backToProjects()">← Projetos</button>
    <div><div id="workspaceRepo">Projeto</div><div id="workspaceMeta"></div></div>
    <div class="spacer"></div><div id="workspaceSession"></div>
  </div>
  <div class="layout">
    <section class="pane"><div class="paneHead"><strong>ARQUIVOS DO REPOSITÓRIO</strong><span class="spacer"></span><button onclick="loadInventory()">↻</button></div><div id="files"></div></section>
    <section class="pane"><div class="paneHead"><strong id="fileTitle">EDITOR</strong><span class="spacer"></span><button class="primary" onclick="saveFile()">Salvar</button></div><textarea id="editor" spellcheck="false" placeholder="Selecione um arquivo"></textarea></section>
    <section class="pane previewPane"><div class="paneHead"><strong>APLICAÇÃO EM EXECUÇÃO</strong><span class="spacer"></span><button onclick="runPreview()">Executar</button><button onclick="stopPreview()">Parar</button><button onclick="capturePreview()">Capturar</button><button onclick="togglePreviewLogs()">Logs</button><button onclick="refreshPreview(true)">↻</button></div><div id="previewSurface"><iframe id="webPreview"></iframe><img id="imagePreview" alt="Preview do projeto"><div id="emptyPreview">Projeto sem runtime visual ativo</div></div><div id="previewMeta"></div><pre id="previewLogs"></pre></section>
  </div>
</main>
<style>
#editor{flex:1;width:100%;resize:none;border:0;outline:0;background:#050a10;color:var(--text);padding:16px;font:13px/1.55 Consolas,'Cascadia Code',monospace;tab-size:4}.previewPane{background:#050a10}#previewSurface{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#webPreview,#imagePreview{width:100%;height:100%;border:0;display:none;background:white}#imagePreview{object-fit:contain;background:#050a10}#emptyPreview{color:var(--muted);text-align:center;padding:30px}#previewMeta{min-height:42px;padding:8px 10px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#previewLogs{display:none;max-height:190px;overflow:auto;margin:0;padding:10px 12px;border-top:1px solid var(--border);background:#03070b;color:#b8c7da;font:12px/1.45 Consolas,monospace;white-space:pre-wrap}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(300px,1fr) minmax(320px,40%)}.projectGrid{grid-template-columns:1fr}}
</style><script>
const state={project:null,file:null,sha:null,previewMode:null,previewUrl:null,previewRevision:null};
const editable=/\.(py|js|jsx|ts|tsx|json|md|html|css|scss|cs|shader|yaml|yml|toml|txt|xml|ps1)$/i;
function setStatus(text){document.getElementById('status').textContent=text||''}
async function call(name,...args){try{return await window.pywebview.api[name](...args)}catch(e){setStatus(String(e));return {ok:false,summary:String(e)}}}
function repoName(project){const remote=(project.repository||{}).remote||'';const clean=remote.replace(/\.git$/,'').replace(/\\/g,'/');const parts=clean.split(/[/:]/).filter(Boolean);return parts.length?parts[parts.length-1]:project.slug}
function repoHost(remote){if(!remote)return'Git local';if(remote.includes('github.com'))return'GitHub';if(remote.includes('gitlab.com'))return'GitLab';return'Git remoto'}
function chip(text,kind=''){return `<span class="chip ${kind}">${escapeHtml(text)}</span>`}
function escapeHtml(text){return String(text??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderProjects(data){const grid=document.getElementById('projectGrid');grid.innerHTML='';for(const p of data.projects||[]){const repo=p.repository||{};const card=document.createElement('article');card.className='projectCard';const branch=repo.branch||'sem branch';const dirty=repo.dirty?chip(`${repo.changed_entries||0} alteração(ões)`,'dirty'):chip('limpo','git');const apps=(p.apps||[]).map(a=>chip(a)).join('');const remote=repo.remote||'Sem remoto configurado';card.innerHTML=`<div class="projectTop"><div class="repoIcon">⌘</div><div style="min-width:0;flex:1"><div class="projectName">${escapeHtml(repoName(p))}</div><div class="projectRemote">${escapeHtml(repoHost(repo.remote))} · ${escapeHtml(branch)}</div></div></div><div class="projectPath">${escapeHtml(p.path)}</div><div class="projectRemote" title="${escapeHtml(remote)}">${escapeHtml(remote)}</div><div class="chips">${repo.is_repository?chip('Git','git'):chip('Pasta local')}${dirty}${apps}</div><div class="projectActions"><button class="primary" ${p.available?'':'disabled'}>Abrir projeto</button></div>`;card.querySelector('button').onclick=()=>openProject(p.slug);grid.appendChild(card)}if(!grid.children.length)grid.innerHTML='<div class="homeSubtitle">Nenhum projeto registrado.</div>'}
async function init(){setStatus('Carregando projetos...');const data=await call('projects_catalog');if(!data||!data.ok){setStatus(data?.summary||'Falha ao carregar projetos');return}renderProjects(data);setStatus('Pronto')}
</script><script>
async function openProject(slug){setStatus('Abrindo projeto...');const r=await call('select_project',slug);if(!r.ok){setStatus(r.summary);return}state.project=slug;state.file=null;state.sha=null;state.previewRevision=null;document.getElementById('projectHome').classList.add('hidden');document.getElementById('workspace').classList.remove('hidden');document.getElementById('editor').value='';document.getElementById('fileTitle').textContent='EDITOR';const p=r.data.project;const repo=p.repository||{};document.getElementById('workspaceRepo').textContent=repoName(p);document.getElementById('workspaceMeta').textContent=`${repo.branch||'sem branch'} · ${repo.remote||p.path}`;document.getElementById('workspaceSession').textContent=r.data.session_id?`Sessão #${r.data.session_id}`:'';await loadInventory();await ensureProjectRuntime(r.data.preview);setStatus('Pronto')}
async function backToProjects(){document.getElementById('workspace').classList.add('hidden');document.getElementById('projectHome').classList.remove('hidden');const data=await call('projects_catalog');if(data?.ok)renderProjects(data);setStatus('Pronto')}
async function loadInventory(){const root=document.getElementById('files');root.innerHTML='';if(!state.project)return;const r=await call('inventory');if(!r.ok){root.textContent=r.summary;return}for(const item of r.data.entries||[]){if(item.kind!=='file'||!editable.test(item.path||''))continue;const b=document.createElement('button');b.className='file'+(item.path===state.file?' active':'');b.textContent=item.path;b.title=item.path;b.onclick=()=>openFile(item.path);root.appendChild(b)}}
async function openFile(path){setStatus('Abrindo arquivo...');const r=await call('read_file',path);if(!r.ok){setStatus(r.summary);return}state.file=path;state.sha=r.data.sha256;document.getElementById('editor').value=r.data.content||'';document.getElementById('fileTitle').textContent=path;await loadInventory();setStatus('Pronto')}
async function saveFile(){if(!state.file||!state.sha)return;setStatus('Salvando...');const r=await call('save_file',state.file,document.getElementById('editor').value,state.sha);if(!r.ok){setStatus(r.summary);return}state.sha=r.data.sha256;setStatus('Salvo');setTimeout(()=>setStatus('Pronto'),1200)}
function showWeb(url){document.getElementById('imagePreview').style.display='none';document.getElementById('emptyPreview').style.display='none';const f=document.getElementById('webPreview');f.style.display='block';if(f.dataset.url!==url){f.src=url;f.dataset.url=url}}
function showImage(src){document.getElementById('webPreview').style.display='none';document.getElementById('emptyPreview').style.display='none';const img=document.getElementById('imagePreview');img.style.display='block';img.src=src}
function showEmpty(text){document.getElementById('webPreview').style.display='none';document.getElementById('imagePreview').style.display='none';const e=document.getElementById('emptyPreview');e.style.display='block';e.textContent=text||'Nenhum preview disponível'}
</script><script>
async function refreshPreview(force=false){if(!state.project)return;const r=await call('preview_status');if(!r.ok){showEmpty(r.summary);return}const p=r.data;state.previewMode=p.mode;state.previewUrl=p.url;const rt=p.runtime||{};document.getElementById('previewMeta').textContent=`${p.mode||'—'} · ${rt.state||'stopped'}${rt.running?' · runtime ativo':''}${p.url?' · '+p.url:''}`;if(p.mode==='web'&&p.url){showWeb(p.url);return}const img=await call('preview_image');if(!img.ok){showEmpty(img.summary);return}const rev=img.data.revision;if(force||rev!==state.previewRevision){state.previewRevision=rev;showImage(img.data.src)}}
async function ensureProjectRuntime(preview){const p=preview&&preview.data;if(p&&p.mode==='web'&&!p.url&&!(p.runtime||{}).running){setStatus('Iniciando aplicação...');const r=await call('preview_start');if(!r.ok){showEmpty(r.summary);setStatus(r.summary);return}}await refreshPreview(true)}
async function runPreview(){setStatus('Iniciando preview...');const r=await call('preview_start');setStatus(r.summary||'');if(r.ok)await refreshPreview(true)}
async function stopPreview(){setStatus('Parando preview...');const r=await call('preview_stop');setStatus(r.summary||'');await refreshPreview(true)}
async function capturePreview(){setStatus('Capturando...');const r=await call('preview_capture');setStatus(r.summary||'');if(r.ok){state.previewRevision=null;await refreshPreview(true)}}
async function togglePreviewLogs(){const box=document.getElementById('previewLogs');const open=box.style.display==='block';box.style.display=open?'none':'block';if(!open){const r=await call('preview_logs',65536);box.textContent=r.ok?(r.data.tail||'(sem logs)'):(r.summary||'Falha ao ler logs');box.scrollTop=box.scrollHeight}}
setInterval(()=>{if(!document.getElementById('workspace').classList.contains('hidden'))refreshPreview(false)},3000);
window.addEventListener('pywebviewready',init);
</script>
</body>
</html>
