name: Windows Product Build

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - "scripts/windows/build-ordax-studio-product.ps1"
      - "tests/test_windows_product_packaging.py"
      - "pyproject.toml"
      - ".github/workflows/windows-product-build.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packaging-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging contract tests
        run: python -m unittest tests.test_windows_product_packaging

  build-installer:
    needs: packaging-contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build ORDAX Studio product
        shell: powershell
        run: .\scripts\windows\build-ordax-studio-product.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\dist\windows"
      - name: Write checksums
        shell: powershell
        run: |
          Get-ChildItem .\dist\windows\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content .\dist\windows\SHA256SUMS.txt -Encoding ascii
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ordax-studio-windows-x64
          path: |
            dist/windows/ORDAX-Studio-Setup-*.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  install-smoke:
    needs: build-installer
    runs-on: windows-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ordax-studio-windows-x64
          path: artifact
      - name: Install, start runtime and verify localhost health
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem .\artifact\ORDAX-Studio-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "ORDAX Studio installer artifact is missing" }
          $installRoot = Join-Path $env:RUNNER_TEMP "ordax-studio-install"
          $installLog = Join-Path $env:RUNNER_TEMP "ordax-studio-install.log"
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installRoot",
            "/LOG=$installLog"
          ) -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 200 }
            throw "ORDAX Studio silent install failed: $($installProcess.ExitCode)"
          }

          $studioExe = Join-Path $installRoot "ORDAX Studio.exe"
          $runtimeExe = Join-Path $installRoot "ORDAX Runtime.exe"
          $privatePython = Join-Path $installRoot "runtime\python.exe"
          foreach ($required in @($studioExe, $runtimeExe, $privatePython)) {
            if (-not (Test-Path $required)) {
              if (Test-Path $installLog) { Get-Content $installLog -Tail 200 }
              throw "Installed product file is missing: $required"
            }
          }

          & $privatePython -c "import ordax_studio, ordax_dev_agent, ordax_device_agent; print('ORDAX_INSTALLED_RUNTIME_OK')"
          if ($LASTEXITCODE -ne 0) { throw "Installed private runtime import smoke failed" }

          $runtime = Start-Process -FilePath $runtimeExe -WorkingDirectory $installRoot -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            $status = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/status" -TimeoutSec 2
                if ($status) { break }
              } catch {
                Start-Sleep -Milliseconds 750
              }
            }
            if (-not $status) { throw "Installed ORDAX Runtime did not expose localhost health" }
            if (-not $status.runtime) { throw "ORDAX Runtime health payload is missing runtime state" }
            Write-Host ("ORDAX_RUNTIME_STATE=" + [string]$status.runtime.state)
          } finally {
            Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "ORDAX Studio uninstaller is missing" }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "ORDAX Studio silent uninstall failed: $($uninstallProcess.ExitCode)"
          }
