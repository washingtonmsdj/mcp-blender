name: Windows Product Build

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - "scripts/windows/build-ordax-studio-product.ps1"
      - "tests/test_windows_product_packaging.py"
      - "pyproject.toml"
      - ".github/workflows/windows-product-build.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packaging-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging contract tests
        run: python -m unittest tests.test_windows_product_packaging

  build-installer:
    needs: packaging-contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build ORDAX Studio product
        shell: powershell
        run: .\scripts\windows\build-ordax-studio-product.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\dist\windows"
      - name: Write checksums
        shell: powershell
        run: |
          Get-ChildItem .\dist\windows\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content .\dist\windows\SHA256SUMS.txt -Encoding ascii
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ordax-studio-windows-x64
          path: |
            dist/windows/ORDAX-Studio-Setup-*.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
