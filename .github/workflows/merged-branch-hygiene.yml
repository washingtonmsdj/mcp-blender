name: Merged Branch Hygiene

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete just-merged transient branch when safe
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/branch-hygiene.sh branch "${{ github.event.pull_request.head.ref }}"

      - name: Sweep previously merged transient branches
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/branch-hygiene.sh sweep
