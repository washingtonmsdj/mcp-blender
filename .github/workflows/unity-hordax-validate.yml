name: Validate HORDAX in Unity

on:
  workflow_dispatch:
    inputs:
      hordax_ref:
        description: HORDAX branch, tag or commit to validate
        required: true
        default: dev/weapon-crowd-systems
        type: string
      execute_method:
        description: Static Unity Editor validation method
        required: true
        default: HORDAX.EditorTools.CiValidation.Run
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout MCP bridge
        uses: actions/checkout@v4
        with:
          path: toolbridge
          persist-credentials: false

      - name: Checkout HORDAX
        uses: actions/checkout@v4
        with:
          repository: washingtonmsdj/HORDAX-game
          ref: ${{ inputs.hordax_ref }}
          path: hordax
          persist-credentials: false

      - name: Detect Unity
        shell: pwsh
        run: .\toolbridge\scripts\windows\toolchain-status.ps1 -RequireUnity

      - name: Run HORDAX Unity validation
        shell: pwsh
        run: |
          .\toolbridge\scripts\windows\unity-run.ps1 `
            -ProjectPath "$env:GITHUB_WORKSPACE\hordax" `
            -ExecuteMethod "${{ inputs.execute_method }}" `
            -LogFile "$env:GITHUB_WORKSPACE\unity-logs\hordax-unity.log"

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hordax-unity-log-${{ github.run_id }}
          path: unity-logs/hordax-unity.log
          if-no-files-found: warn
          retention-days: 14
