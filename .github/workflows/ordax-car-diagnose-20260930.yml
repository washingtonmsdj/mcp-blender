name: ORDAX Car Smoke Diagnostics

on:
  push:
    branches:
      - codex/ordax-car-smoke-20260930
    paths:
      - .github/workflows/ordax-car-diagnose-20260930.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: cloudflare-v3
    env:
      CONTROL_PLANE_URL: https://ordax-control-plane-v3.ordax-ac1ca1b50d09.workers.dev
      ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
      START_JOB_ID: 35b10f5b-85eb-4158-92fc-f41f8bb1674e
    steps:
      - name: Resolve signed startup-log URL and download
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ORDAX_OPERATOR_TOKEN" \
            "$CONTROL_PLANE_URL/v3/jobs/$START_JOB_ID")"
          signed_url="$(jq -er '.job.result.data.uploaded_artifacts[] | select(.metadata.action == "blender.live_start") | .signed_url' <<<"$response" | head -1)"
          curl --fail-with-body --silent --show-error "$signed_url" -o blender-startup.log
          test -s blender-startup.log
          sed -E 's/(token|secret|authorization)[=: ][^ ]+/<redacted>/Ig' blender-startup.log | tail -200
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ordax-blender-startup-log
          path: blender-startup.log
          if-no-files-found: error
