name: Bridge CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q mcp_blender_unity ordax_core ordax_studio ordax_dev_agent ordax_device_agent scripts/verify_visual_agent.py scripts/blender_benchmark.py scripts/verify_packaged_companion_bundle.py scripts/cloudflare/verify_product_auth_provider.py scripts/product_mcp_smoke.py

      - name: Validate ORDAX Dev JavaScript
        run: |
          node --check ordax_studio/assets/studio.js
          node --check ordax_studio/assets/product_account.js
          node --check ordax_studio/assets/blender-connection.js

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Cloudflare v3 Worker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$RUNNER_TEMP/ordax-cloudflare-worker"
          npx --yes wrangler@4.141.0 deploy --dry-run \
            -c control-plane/cloudflare/wrangler.ci.toml \
            --outdir "$out"

      - name: Verify Cloudflare v3 end to end
        if: runner.os == 'Linux'
        shell: bash
        run: |
          state="$RUNNER_TEMP/ordax-cloudflare-state"
          log="$RUNNER_TEMP/ordax-cloudflare-dev.log"
          npx --yes wrangler@4.141.0 d1 migrations apply DB --local \
            --persist-to "$state" \
            -c control-plane/cloudflare/wrangler.ci.toml
          npx --yes wrangler@4.141.0 d1 execute DB --local \
            --persist-to "$state" \
            -c control-plane/cloudflare/wrangler.ci.toml \
            --command "INSERT INTO ordax_devices (id,name,token_sha256,created_at) VALUES ('11111111-1111-4111-8111-111111111111','retention-ci','aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','2020-01-01T00:00:00.000Z'); INSERT INTO ordax_product_device_pairings (id,device_id,secret_sha256,created_at,expires_at) VALUES ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb','2020-01-01T00:00:00.000Z','2020-01-01T01:00:00.000Z'); INSERT INTO ordax_product_device_links (id,subject_id,space_id,device_id,created_at,revoked_at) VALUES ('33333333-3333-4333-8333-333333333333','ci:retention','','11111111-1111-4111-8111-111111111111','2020-01-01T00:00:00.000Z','2020-01-02T00:00:00.000Z'); INSERT INTO ordax_product_grants (id,subject_id,device_id,actions_json,projects_json,created_at,revoked_at) VALUES ('44444444-4444-4444-8444-444444444444','ci:retention','11111111-1111-4111-8111-111111111111','[]','[]','2020-01-01T00:00:00.000Z','2020-01-02T00:00:00.000Z'); INSERT INTO ordax_product_audit (request_id,subject_id,grant_id,device_id,action,phase,decision,reason,payload_fields_json,result_ok,created_at) VALUES ('retention-ci-request','ci:retention',NULL,'11111111-1111-4111-8111-111111111111','projects.list','decision','allow','ci-retention','[]',1,'2020-01-01T00:00:00.000Z');"

          npx --yes wrangler@4.141.0 dev \
            -c control-plane/cloudflare/wrangler.ci.toml \
            --persist-to "$state" \
            --test-scheduled \
            --port 8787 \
            --var ORDAX_OPERATOR_TOKEN:e2e-secret >"$log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
            cat "$log"
            exit 1
          fi
          python scripts/verify_cloudflare_v3.py \
            --base-url http://127.0.0.1:8787 \
            --operator-token e2e-secret

          curl --fail --silent --show-error \
            "http://127.0.0.1:8787/__scheduled?cron=17+3+*+*+*" >/dev/null

          for attempt in $(seq 1 20); do
            retention_json="$(npx --yes wrangler@4.141.0 d1 execute DB --local \
              --persist-to "$state" \
              -c control-plane/cloudflare/wrangler.ci.toml \
              --json \
              --command "SELECT (SELECT COUNT(*) FROM ordax_product_audit WHERE subject_id='ci:retention') AS audits, (SELECT COUNT(*) FROM ordax_product_device_pairings WHERE device_id='11111111-1111-4111-8111-111111111111') AS pairings, (SELECT COUNT(*) FROM ordax_product_device_links WHERE subject_id='ci:retention') AS links, (SELECT COUNT(*) FROM ordax_product_grants WHERE subject_id='ci:retention') AS grants;")"
            if python -c 'import json,sys; data=json.load(sys.stdin); rows=(data[0].get("results") or []) if data else []; row=rows[0] if rows else {}; raise SystemExit(0 if all(int(row.get(k,1)) == 0 for k in ("audits","pairings","links","grants")) else 1)' <<<"$retention_json"; then
              echo "Product retention scheduled handler purged expired CI records"
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "$retention_json"
              echo "Product retention scheduled handler did not purge expired CI records" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Validate shell scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/branch-hygiene.sh
          bash -n scripts/cloudflare/deploy-v3.sh

      - name: Verify packaged Blender companion bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wheel_dir="$RUNNER_TEMP/ordax-wheel"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          python scripts/verify_packaged_companion_bundle.py "$wheel_dir"

      - name: Validate package metadata
        shell: bash
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          assert project["name"] == "mcp-blender-unity"
          assert project["requires-python"] == ">=3.11"
          print("pyproject.toml OK")
          PY

  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path .\scripts\windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            } else {
              Write-Host "OK $($_.FullName)"
            }
          }

          if ($failed) { exit 1 }

      - name: Validate ScheduledTask enums and object construction
        shell: pwsh
        run: |
          Import-Module ScheduledTasks -ErrorAction Stop
          $userId = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $action = New-ScheduledTaskAction -Execute $env:ComSpec -Argument '/d /c "echo ordax"' -WorkingDirectory $env:RUNNER_TEMP
          $logonTrigger = New-ScheduledTaskTrigger -AtLogOn -User $userId
          $maintenanceTrigger = New-ScheduledTaskTrigger -Once -At ((Get-Date).AddMinutes(1)) -RepetitionInterval (New-TimeSpan -Minutes 1) -RepetitionDuration (New-TimeSpan -Days 3650)
          $triggers = @($logonTrigger, $maintenanceTrigger)
          $settings = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -StartWhenAvailable -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero)
          $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType Interactive -RunLevel Limited
          $task = New-ScheduledTask -Action $action -Trigger $triggers -Settings $settings -Principal $principal -Description "OrdaX CI validation"
          if (-not $task) { throw "ScheduledTask object construction failed." }
          Write-Host "ScheduledTask enum/object construction OK."

      - name: Ensure old app files are gone
        shell: pwsh
        run: |
          $forbidden = @(
            "package.json",
            "src",
            "supabase",
            "vite.config.ts",
            "bun.lockb"
          )

          foreach ($path in $forbidden) {
            if (Test-Path $path) {
              throw "Legacy Ordax file/directory still present: $path"
            }
          }

          Write-Host "Repository cleanup invariant OK."
