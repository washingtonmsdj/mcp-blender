name: Deploy Cloudflare v3 Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-v3-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-v3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Device Agent package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ORDAX_OPERATOR_TOKEN" || { echo "Missing ORDAX_OPERATOR_TOKEN"; exit 1; }

      - name: Provision and deploy
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: bash scripts/cloudflare/deploy-v3.sh

      - name: Wait for public health
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
        run: |
          test -n "$CONTROL_PLANE_URL" || { echo "Deploy did not expose control-plane URL"; exit 1; }
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$CONTROL_PLANE_URL/health" | grep -q 'ordax-control-plane-v3'; then
              echo "Remote health OK: $CONTROL_PLANE_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Remote health did not become ready: $CONTROL_PLANE_URL"
          exit 1

      - name: Verify remote Cloudflare v3 end to end
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: |
          python scripts/verify_cloudflare_v3.py \
            --base-url "$CONTROL_PLANE_URL" \
            --operator-token "$ORDAX_OPERATOR_TOKEN"

      - name: Record verified endpoint
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
        run: |
          {
            echo "## Cloudflare v3 verified"
            echo
            echo "Control plane: `$CONTROL_PLANE_URL`"
            echo
            echo "Health, WebSocket job delivery, lease, D1 persistence and R2 round-trip passed."
          } >> "$GITHUB_STEP_SUMMARY"
