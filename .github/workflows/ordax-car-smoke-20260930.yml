name: ORDAX 0.3.4 Car Smoke

on:
  push:
    branches:
      - codex/ordax-car-smoke-20260930
    paths:
      - .github/workflows/ordax-car-smoke-20260930.yml

permissions:
  contents: read

jobs:
  resume-car:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-v3
    env:
      CONTROL_PLANE_URL: https://ordax-control-plane-v3.ordax-ac1ca1b50d09.workers.dev
      ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
      DEVICE_ID: 75d0cda4-95d9-4f3b-9e93-f3645ccc7a19
      PROJECT: bay-of-all-saints
    steps:
      - name: Resume car from existing typed objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results captures

          run_action() {
            local label="$1" action="$2" payload="$3"
            local try body response job_id status ok summary
            for try in 1 2 3 4 5; do
              body="$(jq -cn --arg device_id "$DEVICE_ID" --arg action "$action" --argjson payload "$payload" '{device_id:$device_id,action:$action,payload:$payload}')"
              response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ORDAX_OPERATOR_TOKEN" -H 'Content-Type: application/json' -d "$body" "$CONTROL_PLANE_URL/v3/jobs")"
              job_id="$(jq -er '.job_id' <<<"$response")"
              echo "[$label] try=$try job=$job_id"
              for poll in $(seq 1 180); do
                response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ORDAX_OPERATOR_TOKEN" "$CONTROL_PLANE_URL/v3/jobs/$job_id")"
                status="$(jq -r '.job.status // "unknown"' <<<"$response")"
                if [[ "$status" == "succeeded" ]]; then
                  printf '%s\n' "$response" > "results/$label.json"
                  ok="$(jq -r '.job.result.ok // false' <<<"$response")"
                  [[ "$ok" == "true" ]] && return 0
                  break
                fi
                if [[ "$status" == "failed" || "$status" == "cancelled" ]]; then
                  printf '%s\n' "$response" > "results/$label.json"
                  break
                fi
                sleep 2
              done
              summary="$(jq -r '.job.result.summary // .job.error_code // "unknown"' <<<"$response")"
              echo "[$label] $summary"
              if grep -qiE 'WinError 5|Acesso negado.*presence\.json' <<<"$summary" && [[ "$try" -lt 5 ]]; then
                sleep 1
                continue
              fi
              jq '{status:.job.status,error_code:.job.error_code,result:.job.result,events:.events}' <<<"$response" >&2
              return 1
            done
            return 1
          }

          objects='["ORDAX_Car_Body","ORDAX_Car_Cabin","ORDAX_Car_Hood","ORDAX_Car_Wheel_FL","ORDAX_Car_Wheel_FR","ORDAX_Car_Wheel_RL","ORDAX_Car_Wheel_RR"]'

          run_action start blender.live_start "$(jq -cn --arg project "$PROJECT" '{project:$project,wait_seconds:120}')"
          run_action verify blender.live_scene_snapshot "$(jq -cn --arg project "$PROJECT" --argjson objects "$objects" '{project:$project,object_names:$objects,max_objects:20,timeout_seconds:60}')"

          run_action cabin_material blender.live_material_apply "$(jq -cn --arg project "$PROJECT" '{project:$project,object_name:"ORDAX_Car_Cabin",material_name:"ORDAX_Car_Glass",base_color:[0.035,0.065,0.11,1.0],metallic:0.05,roughness:0.18,timeout_seconds:60}')"
          for tag in FL FR RL RR; do
            run_action "wheel_${tag}_material" blender.live_material_apply "$(jq -cn --arg project "$PROJECT" --arg name "ORDAX_Car_Wheel_$tag" '{project:$project,object_name:$name,material_name:"ORDAX_Car_Tire",base_color:[0.012,0.012,0.015,1.0],metallic:0.0,roughness:0.72,timeout_seconds:60}')"
          done

          run_action save blender.live_save "$(jq -cn --arg project "$PROJECT" '{project:$project,target_path:"automation/blender/ordax_car_smoke.blend",timeout_seconds:120}')"
          run_action multiview blender.live_multiview_capture "$(jq -cn --arg project "$PROJECT" --argjson objects "$objects" '{project:$project,views:["front","left","right","top","three_quarter"],object_names:$objects,timeout_seconds:240}')"

          jq '{result:.job.result,artifacts:.artifacts}' results/multiview.json > results/final-summary.json
          jq -r '.job.result.data.uploaded_artifacts[]? | [.signed_url,.storage_path] | @tsv' results/multiview.json | while IFS=$'\t' read -r signed_url storage_path; do
            [[ -n "$signed_url" ]] || continue
            name="$(basename "$storage_path")"
            curl --fail-with-body --silent --show-error "$signed_url" -o "captures/$name"
            echo "Downloaded $name"
          done

      - name: Upload car smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordax-car-smoke-evidence
          path: |
            results/
            captures/
          if-no-files-found: warn
