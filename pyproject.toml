[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-blender-unity"
version = "0.3.0"
description = "OrdaX Device Agent bridge for typed local projects, Blender, Unity and Git"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "supabase>=2.18.0,<3.0.0",
  "httpx>=0.26.0,<1.0.0",
  "Pillow>=10.0.0,<12.0.0"
]

[project.scripts]
mcp-blender-unity = "mcp_blender_unity.server:main"
ordax-dev-agent = "ordax_dev_agent.main:main"
ordax-project-mcp = "ordax_dev_agent.mcp_server:main"
ordax-device-agent = "ordax_device_agent.main:main"
ordax-device-mcp = "ordax_device_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mcp_blender_unity*", "ordax_dev_agent*", "ordax_device_agent*"]

[tool.setuptools.package-data]
ordax_dev_agent = ["assets/*.py", "assets/*.cs", "assets/*.json"]
