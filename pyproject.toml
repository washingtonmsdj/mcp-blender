[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-blender-unity"
version = "0.1.0"
description = "Local MCP bridge for Blender CLI and Unity CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2.0.0"
]

[project.scripts]
mcp-blender-unity = "mcp_blender_unity.server:main"
ordax-dev-agent = "ordax_dev_agent.main:main"

[tool.setuptools.packages.find]
include = ["mcp_blender_unity*", "ordax_dev_agent*"]
